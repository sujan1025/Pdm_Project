<!DOCTYPE html>
<html>
<head>
    <title>Machine Failure Prediction</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container">
        <h1>Machine Failure Prediction</h1>

        <p>
            Enter machine operating values below. The system will predict whether
            the machine is at risk of failure.
        </p>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST" class="form-card">

            <label>Machine Type</label>
            <select name="machine_type" required>
                <option value="L">L - Low Quality</option>
                <option value="M">M - Medium Quality</option>
                <option value="H">H - High Quality</option>
            </select>

            <label>Air Temperature [K]</label>
            <input type="number" step="0.1" name="air_temperature" required>

            <label>Process Temperature [K]</label>
            <input type="number" step="0.1" name="process_temperature" required>

            <label>Rotational Speed [rpm]</label>
            <input type="number" step="1" name="rotational_speed" required>

            <label>Torque [Nm]</label>
            <input type="number" step="0.1" name="torque" required>

            <label>Tool Wear [min]</label>
            <input type="number" step="1" name="tool_wear" required>

            <button type="submit">Predict Failure Risk</button>
        </form>

        <br>
        <a href="{{ url_for('main.dashboard') }}">Back to Dashboard</a>
    </div>

</body>
</html>
